<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    background: #011459;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }
  /* The faint contour lines, drawn in white over the navy ground. */
  .waves { position: absolute; inset: 0; }
  .pad { position: absolute; inset: 0; padding: 82px 74px 0; }

  /* Badge + wordmark lockup. */
  .lockup { display: flex; align-items: center; gap: 30px; }

  /* The badge sits on a WHITE DISC, not straight on the navy. The shipped PNG
     is transparent inside its ring, so on a navy ground the mountains and the
     "602" — both navy — vanish into the background and all that survives is the
     red sun and the red "MEDICARE". The disc is the navy-ground variant. */
  .disc {
    width: 152px; height: 152px;
    border-radius: 50%;
    background: #FFFFFF;
    display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  .disc img { width: 140px; height: 140px; display: block; }

  /* White wordmark — one color, because the two-tone red/navy lockup needs a
     light ground to work and this card does not have one. */
  .brand {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 60px; font-weight: 600; letter-spacing: -0.025em;
    line-height: 1;
    color: #FFFFFF;
  }

  h1 {
    margin-top: 46px;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    /* The line break is explicit below — the card is a fixed canvas, so the
       two-line shape is part of the design, not something to leave to wrapping. */
    font-size: 74px;
    line-height: 1.1;
    letter-spacing: -0.025em;
    color: #FFFFFF;
  }

  /* The accent, and the only red above the bar. */
  .rule { margin-top: 34px; width: 118px; height: 4px; background: #D10A0F; }

  .sub {
    margin-top: 26px;
    font-size: 25px;
    color: #C6CEE8;
    letter-spacing: -0.005em;
  }

  .kicker {
    position: absolute;
    left: 74px;
    /* Clears the 22px bar with room to spare. Any higher and it collides with
       the .sub line, which sits at ~520px on a 630px canvas. */
    bottom: 46px;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.11em;
    color: #FF5A5F;
  }

  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: #D10A0F; }
</style>
</head>
<body>
  <svg class="waves" viewBox="0 0 1200 630" fill="none" preserveAspectRatio="none">
    <g stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.4" fill="none">
      <path d="M-40 78 C 240 40, 460 96, 700 62 S 1120 22, 1260 58" />
      <path d="M-40 150 C 300 118, 520 172, 780 138 S 1140 96, 1260 132" />
      <path d="M-40 470 C 260 430, 500 500, 760 462 S 1130 420, 1260 452" />
      <path d="M-40 536 C 300 500, 540 560, 800 524 S 1150 486, 1260 516" />
      <path d="M-40 596 C 260 566, 520 616, 780 584 S 1140 552, 1260 578" />
    </g>
  </svg>

  <div class="pad">
    <div class="lockup">
      <!-- Inlined as a data: URI by scripts/build-og.mjs — Chrome renders this
           from a temp directory, so a relative path would resolve to nothing. -->
      <span class="disc"><img src="{{BADGE}}" alt="" /></span>
      <div class="brand">602Medicare</div>
    </div>

    <h1>Medicare, explained by<br />someone who lives here.</h1>
    <div class="rule"></div>
    <p class="sub">Phoenix-metro Medicare guidance · Office in Anthem, Arizona</p>
  </div>

  <div class="kicker">22+ YEARS · LICENSED IN 18 STATES · NPN 8206556</div>
  <div class="bar"></div>
</body>
</html>
